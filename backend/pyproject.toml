[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otwartekarty-api"
version = "0.1.0"
description = "API gry OtwarteKarty"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2,<4",
    "google-genai>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL; set TEST_DATABASE_URL to run"]
