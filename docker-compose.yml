# Both app images build from the repo root: backend and frontend read shared/cards.json.
# Local backend dev only needs the database: `docker compose up -d db`.
name: otwartekarty  # containers, images and the pgdata volume are prefixed with this
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: otwartekarty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otwartekarty}  # dev default; set a real one when deploying
      POSTGRES_DB: otwartekarty
    ports: ["5432:5432"]  # for the backend and integration tests run outside Docker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otwartekarty -d otwartekarty"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    env_file: [{ path: backend/.env, required: false }]  # e.g. GEMINI_API_KEY; `environment` below wins over it
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev}
      DATABASE_URL: postgresql://otwartekarty:${POSTGRES_PASSWORD:-otwartekarty}@db:5432/otwartekarty
      SESSION_SECRET: ${SESSION_SECRET:-}  # mObywatel mock tokens; empty = random per start
      # AI settings (GEMINI_API_KEY, GEMINI_MODEL, LLM_*) come only from backend/.env: an `${VAR:-}` entry here
      # would override the file with an empty value.
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["3000:3000"]
    env_file: [{ path: frontend/.env, required: false }]  # `environment` below wins over it
    environment:
      API_URL: http://backend:8000  # server-side only (Next proxy); runtime, so no rebuild per environment
    depends_on: [backend]

volumes:
  pgdata:
